name: Feature request
description: Propose new functionality
type: Feature
body:
  - type: textarea
    id: problem
    attributes: { label: Problem / use case }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed solution, description: Tools, parameters, and the OSM API endpoints involved. }
  - type: textarea
    id: plan
    attributes: { label: Implementation plan, description: Optional checklist of steps. }
