name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write # npm trusted publishing (OIDC) + provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # npm >= 11.5 is required for trusted publishing
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: npm install -g npm@^11.5.1 && npm --version
      - run: npm ci
      - name: Check tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run typecheck && npm test && npm run build
      - name: Publish to npm (skipped if this version already exists)
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm; skipping publish."
          else
            npm publish --provenance --access public
          fi
      - name: GitHub release (skipped if it already exists)
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists."
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
